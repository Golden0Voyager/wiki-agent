[project]
name = "knowledge-base"
version = "0.2.0"
description = "WikiAgent — 跨领域个人知识复利系统"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    # Core API
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "httpx>=0.28",
    "pydantic>=2.13",
    "loguru>=0.7",
    "python-dotenv>=1.2",
    # LLM Providers
    "openai>=2.32",
    "google-generativeai>=0.8",
    "tenacity>=9.1",
    # Document Parsing
    "pymupdf>=1.27",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "tabulate>=0.10",
    # RAG & Vector DB
    "langchain>=1.2",
    "langchain-community>=0.4",
    "langchain-huggingface>=1.2",
    "langchain-chroma>=1.1",
    "chromadb>=1.5",
    "sentence-transformers>=5.4",
    "torch>=2.11",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
query = "scripts.query_kb:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "W293", "SIM105", "SIM108", "B007"]
"api.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]
